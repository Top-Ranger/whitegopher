# Untested sketch: nginx server block in front of galdav (TLS certificate
# paths are examples). All WebDAV methods pass through proxy_pass unchanged.
server {
	listen 443 ssl;
	http2 on;
	server_name cal.example.com;

	ssl_certificate     /etc/letsencrypt/live/cal.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/cal.example.com/privkey.pem;

	client_max_body_size 12m;   # galdav accepts objects up to 10 MiB

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# $proxy_add_x_forwarded_for appends the peer; galdav reads the
		# rightmost untrusted entry, so a forged header cannot hide the client.
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 120s;
	}
}

server {
	listen 80;
	server_name cal.example.com;
	return 301 https://$host$request_uri;
}

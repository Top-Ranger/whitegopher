# /etc/whitegopher/config.yaml — see docs/configuration.md for every option.

# Where whitegopher listens. Keep it on loopback and put a TLS-terminating reverse
# proxy in front (see docs/deployment.md).
listen: "127.0.0.1:8080"

# HTTP Basic auth realm. It is also part of imported legacy password hashes:
# when importing them, use the realm they were made with until those users
# have signed in once.
realm: "whitegopher"

# The database DSN belongs in the environment file (WHITEGOPHER_DB_DSN), not here.
# db:
#   dsn: "whitegopher:PASSWORD@tcp(127.0.0.1:3306)/whitegopher"

# Reverse proxies whose X-Forwarded-For / X-Forwarded-Proto are believed.
# Default is loopback; add your proxy's address if it is on another host.
proxy:
  trusted: ["127.0.0.1", "::1"]

# Logging: format "text" or "json"; access: true adds one line per request.
# log:
#   format: text
#   access: false

# Prometheus metrics on a separate, unauthenticated listener (off by default).
# metrics:
#   listen: "127.0.0.1:9100"

# Make a new share wait until the other user accepts it (admin UI or client).
# sharing:
#   require_accept: false

# Scheduling-inbox items older than this many days are deleted (0 = keep).
# scheduling:
#   inbox_retention_days: 90
#   imip_require_auth: true   # see "Inbound email" in docs/deployment.md
#   hide_attendees: false     # default for organizers: invitees don't see each other
#   force_hide_attendees: false  # ...and make that mandatory for everyone

# Largest request body (and so object), and the default per-user storage quota
# (0 = unlimited; administrators can set a quota per user in the admin UI).
limits:
  max_request_mib: 10
  default_quota_mib: 0

# Refuse a client address after this many failed logins within the window
# (DAV and admin UI share the count). Failures are logged with the address.
login_limit:
  failures: 10
  window: 15m

admin:
  enabled: true
  # Public address of this server. Together with smtp (below) it turns on
  # "Forgot your password?" by email.
  # base_url: "https://cal.example.com"
  # Who may create single-use invite links for self-registration:
  # "admin" (default), "everyone" or "off".
  # invites: admin

# Optional: email invitations to attendees who have no account here.
# The password goes into WHITEGOPHER_SMTP_PASSWORD.
# smtp:
#   host: smtp.example.com
#   port: 587             # 465 uses implicit TLS; otherwise STARTTLS when offered
#   username: whitegopher
#   from: "whitegopher <noreply@example.com>"

# /etc/galdav/config.yaml — see docs/configuration.md for every option.

# Where galdav listens. Keep it on loopback and put a TLS-terminating reverse
# proxy in front (see docs/deployment.md).
listen: "127.0.0.1:8080"

# HTTP Basic auth realm. It is also part of imported Baikal hashes: when
# importing from Baikal use "BaikalDAV" until those users have signed in once.
realm: "galdav"

# The database DSN belongs in the environment file (GALDAV_DB_DSN), not here.
# db:
#   dsn: "galdav:PASSWORD@tcp(127.0.0.1:3306)/galdav"

# Reverse proxies whose X-Forwarded-For / X-Forwarded-Proto are believed.
# Default is loopback; add your proxy's address if it is on another host.
proxy:
  trusted: ["127.0.0.1", "::1"]

admin:
  enabled: true

# Optional: email invitations to attendees who have no account here.
# The password goes into GALDAV_SMTP_PASSWORD.
# smtp:
#   host: smtp.example.com
#   port: 587
#   username: galdav
#   from: "galdav <noreply@example.com>"

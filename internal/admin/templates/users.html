{{define "content"}}
<div class="page-head"><h1>Users</h1><a class="btn" href="/admin/users/new">New user</a></div>
<section>
  <table>
    <tr><th>Username</th><th class="hide">Name</th><th class="hide">Email</th><th>Role</th><th class="actions"></th></tr>
    {{range .Data}}
    <tr>
      <td>{{.Username}}{{if .Self}} <span class="muted">(you)</span>{{end}}</td>
      <td class="hide">{{.DisplayName}}</td>
      <td class="hide">{{.Email}}</td>
      <td>{{if .IsAdmin}}<span class="tag">admin</span>{{else}}user{{end}}</td>
      <td class="actions"><a href="/admin/users/{{.ID}}">Edit</a></td>
    </tr>
    {{end}}
  </table>
</section>
{{end}}

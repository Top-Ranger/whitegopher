{{define "content"}}
<div class="card narrow">
  <h1>{{if .IsSetup}}Create the administrator{{else}}Sign in{{end}}</h1>
  {{if .IsSetup}}<p class="muted">No users exist yet. This account will be able to manage all users.</p>{{end}}
  <form method="post" action="{{if .IsSetup}}/admin/setup{{else}}/admin/login{{end}}" class="stack">
    <label>Username <input type="text" name="username" autocomplete="username" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="{{if .IsSetup}}new-password{{else}}current-password{{end}}" required></label>
    {{if .IsSetup}}<label>Repeat password <input type="password" name="password2" autocomplete="new-password" required></label>{{end}}
    <button type="submit">{{if .IsSetup}}Create account{{else}}Sign in{{end}}</button>
  </form>
</div>
{{end}}

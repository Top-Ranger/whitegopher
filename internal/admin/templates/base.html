{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · galdav</title>
<link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
{{if .User.ID}}
<header><div class="bar">
  <span class="brand">galdav</span>
  <nav>
    <a href="/admin/"{{if eq .Nav "dashboard"}} class="active"{{end}}>Collections</a>
    {{if .User.IsAdmin}}<a href="/admin/users"{{if eq .Nav "users"}} class="active"{{end}}>Users</a>{{end}}
    <a href="/admin/account"{{if eq .Nav "account"}} class="active"{{end}}>Account</a>
  </nav>
  <form method="post" action="/admin/logout" class="row">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <span class="muted">{{.User.Username}}</span>
    <button class="secondary" type="submit">Sign out</button>
  </form>
</div></header>
{{end}}
<main>
{{if .Flash}}<div class="flash" role="status">{{.Flash}}</div>{{end}}
{{if .Error}}<div class="error" role="alert">{{.Error}}</div>{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}

{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · White Gopher</title>
<link rel="stylesheet" href="/admin/static/admin.css">
<link rel="icon" href="/admin/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/admin/static/icon.png">
</head>
<body>
{{if .User.ID}}
<header><div class="bar">
  <a class="brand" href="/admin/"><img src="/admin/static/icon.svg" alt="" width="40" height="40"><span>White Gopher</span></a>
  <input type="checkbox" id="menu-toggle" class="menu-toggle">
  <label for="menu-toggle" class="menu-btn" aria-label="Menu"><span></span></label>
  <div class="menu">
  <nav aria-label="Main">
    <a href="/admin/"{{if eq .Nav "dashboard"}} class="active" aria-current="page"{{end}}>Collections</a>
    {{if .User.IsAdmin}}<a href="/admin/users"{{if eq .Nav "users"}} class="active" aria-current="page"{{end}}>Users</a>{{end}}
    <a href="/admin/account"{{if eq .Nav "account"}} class="active" aria-current="page"{{end}}>Account</a>
  </nav>
  <form method="post" action="/admin/logout" class="row">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <span class="muted">{{.User.Username}}</span>
    <button class="secondary" type="submit">Sign out</button>
  </form>
  </div>
</div></header>
{{end}}
<main>
{{if .Flash}}<div class="flash" role="status">{{.Flash}}</div>{{end}}
{{if .Error}}<div class="error" role="alert">{{.Error}}</div>{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}
